<!DOCTYPE html>
<html>
<head>
    <title>MovieFlix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color:#141414;
            color:white;
        }

        .hero{
            height:100vh;
            background-image:url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba");
            background-size:cover;
            background-position:center;
            position:relative;
        }

        .overlay{
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
        }

        .hero-content{
            position:absolute;
            top:50%;
            left:10%;
            transform:translateY(-50%);
            z-index:10;
        }

        .hero h1{
            font-size:70px;
            font-weight:bold;
        }

        .search-box{
            width:500px;
        }

        .movie-row{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            margin-top:20px;
        }

        .movie-card{
            display:inline-block;
            transition:0.3s;
            text-align:center;
        }

        .movie-card img{
            width:220px;
            height:320px;
            border-radius:8px;
        }

        .movie-card:hover{
            transform:scale(1.08);
        }

        .navbar{
            background:transparent;
            position:absolute;
            width:100%;
            z-index:100;
        }

        .logo{
            color:red;
            font-size:40px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <span class="logo">MOVIEFLIX</span>

        <a href="{% url 'login' %}" class="btn btn-danger">Sign In</a>
    </div>
</nav>


<section class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <h1>Get Your Movies</h1>
        <h3>Content Based Recommendation System</h3>

        <br>

       
        <form method="POST">
            {% csrf_token %}

            <div class="input-group search-box">

                <input
                    type="text"
                    name="movie"
                    class="form-control form-control-lg"
                    placeholder="Search Movie">

                <button
                    type="submit"
                    class="btn btn-danger btn-lg">
                    Recommend
                </button>

            </div>
        </form>

    
        {% if error %}
            <h4 class="mt-3 text-warning">{{ error }}</h4>
        {% endif %}

    
        {% if recommendations %}

        <div class="movie-row mt-4">

            {% for movie in recommendations %}

            <div class="movie-card">

                <img src="{{ movie.Poster_Link }}" alt="{{ movie.Series_Title }}">

                <h6 class="mt-2">
                    {{ movie.Series_Title }}
                </h6>

            </div>

            {% endfor %}

        </div>

        {% endif %}

    </div>

</section>

</body>
<footer>
    <p>@Developed By ThamizhMani-2026</p>
</footer>
</html>
